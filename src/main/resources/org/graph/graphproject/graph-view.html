<!DOCTYPE html>
<html lang="en">
<head>
    <title>Graph Visualization</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        body { margin: 0; padding: 0; font-family: "Roboto Light",serif }
        .leaflet-popup-content button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .leaflet-popup-content button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Initialize renderer with tolerance for easier clicking
    const myRenderer = L.canvas({ padding: 0.5, tolerance: 10 });

    const map = L.map('map', {
        preferCanvas: true,
        renderer: myRenderer
    }).setView([52.0, 19.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Layer groups - order matters for drawing order on Canvas
    const exploredGroup = L.layerGroup().addTo(map);
    const pathGroup = L.layerGroup().addTo(map);
    const cityLayer = L.layerGroup().addTo(map);

    const resizeObserver = new ResizeObserver(() => {
        map.invalidateSize();
    });
    resizeObserver.observe(document.getElementById('map'));

    let cityMarkers = {};

    window.clearAll = () => {
        cityLayer.clearLayers();
        cityMarkers = {};
        exploredGroup.clearLayers();
        pathGroup.clearLayers();
        map.closePopup();
        map.invalidateSize();
    };

    window.clearPath = () => {
        exploredGroup.clearLayers();
        pathGroup.clearLayers();
        map.closePopup();
        map.invalidateSize();
    };

    window.addCities = (cities) => {
        const markers = [];
        cities.forEach(({ lat, lng, name, id }) => {
            const marker = L.circleMarker([lat, lng], {
                radius: 6,
                fillColor: "#3388ff",
                color: "#000",
                weight: 1,
                opacity: 0.8,
                fillOpacity: 0.6,
                interactive: true
            });

            // Dynamic popup creation only when opening
            marker.on('click', function() {
                const escapedName = name.replace(/'/g, "\\'");
                const content = `
                    <div style="text-align: center; min-width: 120px;">
                        <b style="font-size: 14px;">${name}</b><br><br>
                        <button onclick="window.setAsStart(${id}, '${escapedName}')" style="margin-bottom: 8px; width: 100%;">Add as Start City</button><br>
                        <button onclick="window.setAsTarget(${id}, '${escapedName}')" style="width: 100%;">Add as Target City</button>
                    </div>
                `;
                marker.bindPopup(content).openPopup();
            });

            cityMarkers[id] = marker;
            markers.push(marker);
        });

        requestAnimationFrame(() => {
            markers.forEach(m => m.addTo(cityLayer));
        });
    };

    window.drawPath = (pointsJson) => {
        pathGroup.clearLayers();
        const points = JSON.parse(pointsJson);
        if (!points || points.length === 0) return;

        const latlngs = points.map(p => [p.lat, p.lng]);

        const pathLine = L.polyline(latlngs, {
            color: 'red',
            weight: 5,
            opacity: 0.8,
            interactive: false
        }).addTo(pathGroup);

        requestAnimationFrame(() => {
            map.fitBounds(pathLine.getBounds(), { padding: [50, 50] });
        });
    };

    window.clearExplored = () => {
        exploredGroup.clearLayers();
    };

    window.addExplored = (pointsJson) => {
        const points = typeof pointsJson === 'string' ? JSON.parse(pointsJson) : pointsJson;
        if (!points || points.length === 0) return;

        const markers = [];
        const markerOptions = {
            radius: 3,
            fillColor: "#ffaa00",
            color: "#000",
            weight: 0.5,
            opacity: 0.5,
            fillOpacity: 0.4,
            interactive: false
        };

        points.forEach(({ lat, lng }) => {
            markers.push(L.circleMarker([lat, lng], markerOptions));
        });

        requestAnimationFrame(() => {
            markers.forEach(m => m.addTo(exploredGroup));
        });
    };

    // Old method for compatibility or single call
    window.drawExplored = (pointsJson) => {
        window.clearExplored();
        window.addExplored(pointsJson);
    };

    window.setAsStart = (id, name) => {
        if (window.javaConnector) {
            window.javaConnector.setAsStart(id, name);
            map.closePopup();
        }
    };

    window.setAsTarget = (id, name) => {
        if (window.javaConnector) {
            window.javaConnector.setAsTarget(id, name);
            map.closePopup();
        }
    };

    setTimeout(() => { map.invalidateSize(); }, 500);
</script>
</body>
</html>
